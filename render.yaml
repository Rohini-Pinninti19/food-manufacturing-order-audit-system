services:
  - type: web
    name: grainline-food-manufacturing-erp
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm ci --prefix backend && npm ci --prefix frontend && npm run db:generate --prefix backend && npm run build --prefix frontend
    startCommand: npm run db:deploy --prefix backend && npm start --prefix backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COMPANY_NAME
        value: Fieldstone Foods
      - key: COMPANY_STATE
        value: Tamil Nadu
      - key: COMPANY_GSTIN
        value: ""
